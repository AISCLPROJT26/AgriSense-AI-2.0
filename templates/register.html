{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card card-custom p-4 bg-white shadow-sm border-0">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus text-success fa-3x mb-2"></i>
                <h3 class="fw-bold" style="color: #1b4332;">Create Account</h3>
                <p class="text-muted small">Register for AgriSense AI 2.0</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="name" class="form-label small fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Ramesh Kumar" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="farmer@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill mb-3">
                    <i class="fa-solid fa-user-check me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center">
                <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-semibold text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
