{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card card-custom p-4 bg-white shadow-sm border-0">
            <div class="text-center mb-4">
                <i class="fa-solid fa-seedling text-success fa-3x mb-2"></i>
                <h3 class="fw-bold" style="color: #1b4332;">Farmer Login</h3>
                <p class="text-muted small">Access your AgriSense AI 2.0 dashboard</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="farmer@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Login
                </button>
            </form>

            <div class="text-center">
                <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-semibold text-decoration-none">Register here</a></p>
                <div class="mt-3 pt-3 border-top">
                    <a href="{{ url_for('guest_login') }}" class="btn btn-outline-warning btn-sm w-100 text-dark fw-semibold rounded-pill">
                        <i class="fa-solid fa-bolt me-1"></i> Instant Demo Mode (Guest)
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
