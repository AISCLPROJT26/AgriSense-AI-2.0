{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-custom p-4 bg-white">
            <h3 class="fw-bold mb-3 text-center" style="color: #1b4332;">
                <i class="fa-solid fa-seedling me-2"></i>Smart Crop Recommendation
            </h3>
            <p class="text-muted text-center mb-4">Enter your soil and environmental parameters to find the best crop to cultivate.</p>

            {% if error %}
                <div class="alert alert-danger" role="alert"><i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Nitrogen (N)</label>
                        <input type="number" step="any" name="N" class="form-control bg-light" placeholder="e.g. 90" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Phosphorus (P)</label>
                        <input type="number" step="any" name="P" class="form-control bg-light" placeholder="e.g. 42" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Potassium (K)</label>
                        <input type="number" step="any" name="K" class="form-control bg-light" placeholder="e.g. 43" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Temperature (°C)</label>
                        <input type="number" step="any" name="temperature" class="form-control bg-light" placeholder="e.g. 20.8" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Humidity (%)</label>
                        <input type="number" step="any" name="humidity" class="form-control bg-light" placeholder="e.g. 82.0" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">pH Level</label>
                        <input type="number" step="any" name="ph" class="form-control bg-light" placeholder="e.g. 6.5" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Rainfall (mm)</label>
                        <input type="number" step="any" name="rainfall" class="form-control bg-light" placeholder="e.g. 202.9" required>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success-custom px-5 py-2 fw-bold rounded-pill">Recommend Crop</button>
                </div>
            </form>

            {% if result %}
                <div class="alert alert-success mt-4 text-center p-4 rounded-4 shadow-sm">
                    <h5 class="fw-bold mb-1">Recommended Crop for Cultivation:</h5>
                    <h2 class="text-success fw-bold text-uppercase mb-0">{{ result }}</h2>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
